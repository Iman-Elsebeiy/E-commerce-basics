<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fashion Product</title>
  <link rel="stylesheet" href="css.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="Bootstrap/bootstrap.css">
</head>
<body>

<div class="container">

  <div class="product-section d-flex gap-30 rounded-1 p-3">
         <a class="text-decoration-none btn fs-6 fw-bold btn-close" aria-label="Close" href="index.html"></a>

    <!-- Images -->
    <div class="product-images">
<div class="thumbnails" id="thumbnails">
        <img id="thumb-0" alt="">
        <img id="thumb-1" alt="">
        <img id="thumb-2" alt="">
      </div>
      <div class="main-image">
        <img id="main-img" alt="">
      </div>
    </div>

    <!-- Product Info -->
     <!-- <a href="">x</a> -->
    <div class="product-info">
      <h1 class="product-name fs-2 mb-5">Product Name</h1>
      <div class="d-flex">
      <span class="text-decoration-line-through text-muted oldprice fs-4 me-3">$0.00</span>
      <p class="product-price mb-3 fs-3 fw-bold">$0.00</p>
      </div>
      <div class="cart-buttons  d-flex align-items-center mb-3">
        <!-- <div class="quantity">
          <button id="minus">-</button>
          <span id="qty">1</span>
          <button id="plus">+</button>
        </div> -->
        <button class="add-cart me-3">Add to Cart</button>
        <i  class="fa-regular fa-heart wishlist data-id" id="fav-count"></i>
      </div>

      <!-- Tabs -->
      <div class="description-btns">
        <button class="active">Description</button>
        <button>Additional Info</button>
        <button>Reviews</button>
      </div>
      <div class="content"></div>

      <!-- Footer SKU & Category -->
      <div class="foot-desc"></div>
    </div>

  </div>

</div>

<script src="j.js"></script>
</body>
</html>
