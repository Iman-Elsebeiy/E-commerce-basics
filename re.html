<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register/Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .card-auth { max-width: 400px; margin: 50px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); background: #fff; }
    .btn-main { background: #ff4d4d; color: #fff; transition: 0.3s; }
    .btn-main:hover { background: #e63939; transform: scale(1.05); }
    .reglog{
        color: #e63939;
    }
    .reglog:hover{
        color: #ff4d4d;
    }
  </style>
</head>
<body>

<div class="card-auth">
  <!-- Tabs -->
  <ul class="nav nav-tabs mb-4" id="authTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active reglog" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Login</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link reglog" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Register</button>
    </li>
  </ul>

  <div class="tab-content">
    <!-- Login Form -->
    <div class="tab-pane fade show active" id="login">
      <form id="loginForm">
        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="Enter email" required>
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>
        </div>
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label">Remember Me</label>
        </div>
        <button type="submit" class="btn btn-main w-100">Login</button>
      </form>
    </div>

    <!-- Register Form -->
    <div class="tab-pane fade" id="register">
      <form id="registerForm">
        <div class="mb-3">
          <label>Name</label>
          <input type="text" class="form-control" id="regName" placeholder="Enter name" required>
        </div>
        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" id="regEmail" placeholder="Enter email" required>
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" class="form-control" id="regPassword" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-main w-100">Register</button>
      </form>
    </div>
  </div>
</div>
  
 <div class="text-center">
    <img  src="imgs/logo.png" alt="">
 </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>

</body>
</html>
